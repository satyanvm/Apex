# Local development infrastructure for Agently.
#
#   docker compose up -d        start Postgres in the background
#   docker compose down         stop it (keeps data in the named volume)
#   docker compose down -v      stop it AND wipe the data (fresh schema next up)
#
# On first boot the mounted *.sql files are applied in filename order by the
# postgres image's docker-entrypoint-initdb.d hook. That only runs when the data
# volume is empty, so editing a migration means `down -v` then `up`.
#
# We mount ONLY 0001_init and 0003_queue: those are portable Postgres. 0002_rls
# (auth.uid()) and 0004_realtime (supabase_realtime publication) are Supabase-only
# and would fail here. Locally the Go API connects as a trusted service (RLS
# bypassed) and live updates come from the in-process event bus, so neither is
# needed for development.
services:
  postgres:
    image: postgres:16
    container_name: agently-postgres
    environment:
      POSTGRES_USER: agently
      POSTGRES_PASSWORD: agently
      POSTGRES_DB: agently
    ports:
      # Host 5433 → container 5432, to avoid clashing with a system Postgres.
      - "5433:5432"
    volumes:
      - agently-pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ./packages/db/migrations/0003_queue.sql:/docker-entrypoint-initdb.d/0003_queue.sql:ro
      - ./packages/db/migrations/0005_worker_claim.sql:/docker-entrypoint-initdb.d/0005_worker_claim.sql:ro
      - ./packages/db/migrations/0006_run_input.sql:/docker-entrypoint-initdb.d/0006_run_input.sql:ro
      - ./packages/db/migrations/0007_workflow_default_input.sql:/docker-entrypoint-initdb.d/0007_workflow_default_input.sql:ro
      - ./packages/db/migrations/0008_integrations.sql:/docker-entrypoint-initdb.d/0008_integrations.sql:ro
      - ./packages/db/migrations/0009_temporal_engine.sql:/docker-entrypoint-initdb.d/0009_temporal_engine.sql:ro
      - ./packages/db/migrations/0010_retire_native_engine.sql:/docker-entrypoint-initdb.d/0010_retire_native_engine.sql:ro
      - ./packages/db/migrations/0011_credentials.sql:/docker-entrypoint-initdb.d/0011_credentials.sql:ro
      - ./packages/db/migrations/0012_piece_trigger_state.sql:/docker-entrypoint-initdb.d/0012_piece_trigger_state.sql:ro
      - ./packages/db/migrations/0013_drop_retired_execution_columns.sql:/docker-entrypoint-initdb.d/0013_drop_retired_execution_columns.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agently -d agently"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── Temporal (durability plane for all runs) ────────────────────────────────
  # MIT-licensed. The auto-setup image creates the schema + default namespace on a
  # dedicated Postgres so it never touches the agently app database. Reasoning runs
  # *inside* this: each LangGraph node is a Temporal activity (see apps/reasoner).
  temporal-postgres:
    image: postgres:16
    container_name: agently-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - agently-temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 3s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: agently-temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "7233:7233"   # gRPC frontend (TEMPORAL_HOSTPORT)

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: agently-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"   # Temporal Web UI

volumes:
  agently-pgdata:
  agently-temporal-pgdata:
